<!DOCTYPE html>

<html>
<head>
    <title>Login</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1f2937, #4b5563);
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background-color: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        width: 320px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #1f2937;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    input:focus {
        border-color: #3b82f6;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #3b82f6;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background-color: #2563eb;
    }

    .register-link {
        margin-top: 15px;
        display: block;
        color: #3b82f6;
        text-decoration: none;
    }

    .register-link:hover {
        text-decoration: underline;
    }
</style>
```

</head>
<body>

```
<div class="login-container">
    <h2>🔐 Login</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register" class="register-link">Create an account</a>
</div>
```

</body>
</html>
